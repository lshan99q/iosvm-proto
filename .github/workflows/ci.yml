# SPDX-License-Identifier: MIT
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-asan
